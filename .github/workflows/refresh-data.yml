name: Refresh activity data

# 每天北京时间 04:23 自动抓取 + 语义标注 + 发布；
# 也可以在 Actions 页面手动触发，指定数据源和本次最多标注条数。
on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: 数据源（all / douban / huodongxing / sxhm / sxlib）
        required: false
        default: all
      max_enrich:
        description: 本次最多调用模型标注多少条（控制成本）
        required: false
        default: "80"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout data pipeline
        uses: actions/checkout@v4
        with:
          repository: mmikuchua/xian-activity-spider
          path: _spider

      - name: Install crawler deps
        run: pip install beautifulsoup4

      - name: Crawl, merge and enrich
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/_spider
          ENRICH_CONCURRENCY: "4"
        run: |
          python -m xian_activities.cli update \
            --source "${{ github.event.inputs.sources || 'all' }}" \
            --max-enrich "${{ github.event.inputs.max_enrich || '80' }}" \
            --http-only \
            --out "$GITHUB_WORKSPACE/web/data/activities.json"

      - name: Validate dataset
        run: node --test web/tests/*.test.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- web/data/activities.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "活动数据没有变化"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/activities.json
          git commit -m "data: refresh activities $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: web

      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
