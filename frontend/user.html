<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>问卷 · 文享智配</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 覆盖原有样式，统一颜色，添加背景和动画 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/static/images/question.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* 半透明遮罩，让背景图片柔和 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7); /* 白色半透明，可根据图片调整 */
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.8); /* 半透明白色容器 */
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            font-weight: 600;
            border-bottom: none; /* 移除绿线 */
            padding-bottom: 10px;
            text-align: center;
            font-size: 2.2rem;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .message {
            margin: 8px 0;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            clear: both;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 统一用户和机器人的消息样式，去掉颜色区分 */
        .user-message {
            background: rgba(100, 100, 100, 0.2); /* 统一半透明灰色 */
            color: #222;
            float: right;
            text-align: left;
        }

        .bot-message {
            background: rgba(100, 100, 100, 0.1);
            color: #222;
            float: left;
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
            background: rgba(255,255,255,0.8);
        }

        #user-input:focus {
            border-color: #888;
        }

        #send-btn {
            padding: 12px 24px;
            background: #555;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }

        #send-btn:hover {
            background: #333;
            transform: scale(1.05);
        }

        /* 移除所有表情和装饰性元素 */
        .message::before, .message::after {
            display: none;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 15px;
            }
            h1 {
                font-size: 1.8rem;
            }
            #chat-box {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文享智配 · 问卷</h1>
        <div id="chat-box">
            <div class="message bot-message" id="question-text">{{ first_question }}</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="请输入选项字母" autocomplete="off">
            <button id="send-btn">发送</button>
        </div>
    </div>
    <script>
        const userId = "{{ user_id }}";
        let completed = false;

        function addMessage(text, sender) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendAnswer() {
            const input = document.getElementById('user-input').value.trim();
            if (!input) return;
            document.getElementById('user-input').value = '';
            addMessage(input, 'user');

            const resp = await fetch('/api/user/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, user_input: input })
            });
            const data = await resp.json();

            if (data.is_valid) {
                addMessage(data.response, 'bot');
                if (data.completed) {
                    setTimeout(() => {
                        window.location.href = `/recommend?user_id=${data.user_id}`;
                    }, 1500);
                }
            } else {
                addMessage(data.response, 'bot');
            }
        }

        document.getElementById('send-btn').addEventListener('click', sendAnswer);
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendAnswer();
        });
    </script>
</body>
</html>
