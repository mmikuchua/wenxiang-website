<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文享智配 · 西安公共文化</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                        url('/static/images/xian_city_wall.jpg') center/cover no-repeat fixed;
        }

        /* 半透明遮罩确保黑色文字清晰 */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            z-index: 1;
        }

        h1, p, .button-group {
            position: relative;
            z-index: 2;
        }

        /* 动画定义 */
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 5rem;
            font-weight: 800;
            color: black;
            margin-bottom: 0.5rem;
            letter-spacing: 4px;
            text-shadow: 2px 2px 8px rgba(255,255,255,0.8);
            animation: fadeInDown 1s ease-out;
        }

        .intro {
            font-size: 1.6rem;
            color: #222;
            margin-bottom: 2rem;
            font-weight: 400;
            text-shadow: 1px 1px 4px rgba(255,255,255,0.8);
            animation: fadeIn 1.2s ease-out;
        }

        .button-group {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.2s both; /* 稍晚出现，保持层次感 */
        }

        .btn-hero {
            display: inline-block;
            padding: 16px 48px;
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
            color: black;
            border: 2px solid black;
            border-radius: 50px;
            background-color: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-hero:hover {
            background-color: rgba(255,255,255,0.9);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-color: #333;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            h1 {
                font-size: 3.5rem;
                margin-bottom: 0.3rem;
            }
            .intro {
                font-size: 1.2rem;
                margin-bottom: 1.5rem;
            }
            .btn-hero {
                padding: 12px 30px;
                font-size: 1.2rem;
            }
            .button-group {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>文享智配</h1>
        <p class="intro">西安公共文化 · 精准匹配助手</p>
        <div class="button-group">
            <a href="/user" class="btn-hero">居民端 · 文化活动推荐</a>
            <a href="/admin" class="btn-hero">管理员端 · 数据统计报告</a>
        </div>
    </div>
</body>
</html>
